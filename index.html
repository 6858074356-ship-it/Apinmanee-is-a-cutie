<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat with Gemma · Local AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='chat.js') }}"></script>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">Local AI</div>
      <h1>Chat with Gemma</h1>
      <p class="subtitle">A private conversation with your local Ollama model.</p>
      <nav class="tabs" aria-label="Main navigation">
        <a class="active" href="{{ url_for('index') }}">Chat</a>
        <a href="{{ url_for('documents') }}">Document collection</a>
      </nav>
    </header>

    <section class="chat-card" aria-label="Conversation">
      <div class="chat-bar">
        <span><span class="model">{{ model }}</span> · on your computer</span>
        <button id="new-chat" class="new-chat" type="button">New chat</button>
      </div>
      <div id="conversation" class="messages" aria-live="polite">
        <p id="empty-state" class="empty-state">Ask Gemma anything to get started.</p>
      </div>
      <form id="chat-form" class="composer">
        <label class="sr-only" for="message-input">Ask Gemma anything</label>
        <textarea id="message-input" rows="2" placeholder="Ask Gemma anything…" maxlength="20000" required></textarea>
        <button id="send-button" class="btn" type="submit">Send&nbsp; ↑</button>
      </form>
      <div class="hints"><span>Enter to send · Shift + Enter for a new line</span><span>Local model. Answers can be inaccurate.</span></div>
    </section>
    <footer class="footer">Made for your own corner of the internet.</footer>
  </main>
</body>
</html>
